services:
  mongodb:
    image: mongo:7.0
    container_name: civicfix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: civicfix
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicfix-network

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: civicfix-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/civicfix
      SESSION_SECRET: production_session_secret_change_me_to_32_characters_minimum!
      SESSION_COOKIE_NAME: civicfix.sid
      CLIENT_ORIGIN: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SAME_SITE: lax
      TRUST_PROXY: 1
      EMAIL_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - civicfix-network

volumes:
  mongodb_data:
    driver: local

networks:
  civicfix-network:
    driver: bridge

