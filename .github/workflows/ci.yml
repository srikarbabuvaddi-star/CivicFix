name: CivicFix CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Gate
        run: npm run lint

      - name: Run Automated Test Suites (Vitest + Supertest)
        run: npm test
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/civicfix_ci_test
          SESSION_SECRET: ci_test_session_secret_32_characters_minimum_required!

      - name: Compile Frontend Production Build (Vite)
        run: npm run build

